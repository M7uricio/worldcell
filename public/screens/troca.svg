<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" width="393" height="852" role="img" aria-label="Avaliação do seu aparelho na troca">
  <defs>
    <linearGradient id="gold3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B8862B"/><stop offset=".5" stop-color="#F2D272"/><stop offset="1" stop-color="#B8862B"/>
    </linearGradient>
    <linearGradient id="navy3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151B57"/><stop offset="1" stop-color="#05071C"/>
    </linearGradient>
  </defs>

  <rect width="393" height="852" fill="url(#navy3)"/>

  <text x="30" y="52" font-family="Inter,system-ui,sans-serif" font-size="17" font-weight="700" fill="#fff">9:41</text>
  <g fill="#fff">
    <rect x="304" y="41" width="3.5" height="7" rx="1.5"/><rect x="310" y="38" width="3.5" height="10" rx="1.5"/>
    <rect x="316" y="35" width="3.5" height="13" rx="1.5"/><rect x="322" y="32" width="3.5" height="16" rx="1.5"/>
    <rect x="337" y="34" width="26" height="14" rx="4" opacity=".45"/><rect x="339" y="36" width="19" height="10" rx="2.5"/>
  </g>

  <text x="30" y="124" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="800" letter-spacing="2.6" fill="url(#gold3)">SUA TROCA</text>
  <text x="30" y="164" font-family="Inter,system-ui,sans-serif" font-size="31" font-weight="800" fill="#fff" letter-spacing="-0.9">Avaliamos na</text>
  <text x="30" y="198" font-family="Inter,system-ui,sans-serif" font-size="31" font-weight="800" fill="#fff" letter-spacing="-0.9">hora, com você</text>

  <!-- your device -->
  <rect x="24" y="234" width="345" height="128" rx="24" fill="#fff" opacity=".07"/>
  <rect x="24" y="234" width="345" height="128" rx="24" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="1.5"/>
  <text x="48" y="272" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing="1.6" fill="#8F97D1">SEU APARELHO</text>
  <text x="48" y="306" font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="700" fill="#fff">iPhone 12 · 128 GB</text>
  <text x="48" y="336" font-family="Inter,system-ui,sans-serif" font-size="15" fill="#8F97D1">Bateria 84% · sem trincas</text>

  <!-- arrow -->
  <g transform="translate(196,398)">
    <circle r="26" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".2" stroke-width="1.5"/>
    <path d="M-8 -5h16M4 -11l6 6-6 6" fill="none" stroke="url(#gold3)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M8 9h-16M0 3l-6 6 6 6" fill="none" stroke="url(#gold3)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- new device -->
  <rect x="24" y="450" width="345" height="128" rx="24" fill="url(#gold3)"/>
  <text x="48" y="488" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="800" letter-spacing="1.6" fill="#05071C" opacity=".7">VOCÊ LEVA</text>
  <text x="48" y="522" font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="800" fill="#05071C">iPhone 15 · 256 GB</text>
  <text x="48" y="552" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="600" fill="#05071C" opacity=".75">Com garantia da loja</text>

  <!-- steps -->
  <g font-family="Inter,system-ui,sans-serif">
    <g transform="translate(24,618)">
      <circle cx="20" cy="20" r="20" fill="#fff" fill-opacity=".1"/>
      <text x="20" y="27" font-size="16" font-weight="800" fill="url(#gold3)" text-anchor="middle">1</text>
      <text x="56" y="26" font-size="16" font-weight="600" fill="#fff">Traga o aparelho na loja</text>
    </g>
    <g transform="translate(24,676)">
      <circle cx="20" cy="20" r="20" fill="#fff" fill-opacity=".1"/>
      <text x="20" y="27" font-size="16" font-weight="800" fill="url(#gold3)" text-anchor="middle">2</text>
      <text x="56" y="26" font-size="16" font-weight="600" fill="#fff">Avaliação técnica na hora</text>
    </g>
    <g transform="translate(24,734)">
      <circle cx="20" cy="20" r="20" fill="#fff" fill-opacity=".1"/>
      <text x="20" y="27" font-size="16" font-weight="800" fill="url(#gold3)" text-anchor="middle">3</text>
      <text x="56" y="26" font-size="16" font-weight="600" fill="#fff">Usa como parte do pagamento</text>
    </g>
  </g>
</svg>
